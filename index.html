<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Cancer Awareness & Support</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>

    <header class="hero">
        <div class="hero-content">
            <h1>Hope. Strength. Support.</h1>
            <p>You are not alone in this fight. We are here to help and raise awareness.</p>
        </div>
    </header>

    <section id="contact" class="container">
        <h2>Get In Touch</h2>
        <form id="contactForm">
            <div class="form-group">
                <label for="name">Name:</label>
                <input type="text" id="name" name="name" required>
            </div>

            <div class="form-group">
                <label for="email">Email:</label>
                <input type="email" id="email" required>
            </div>

            <div class="form-group">
                <label for="message">Message:</label>
                <textarea id="message" rows="5" required></textarea>
            </div>

            <button type="submit">Send Message</button>
        </form>
    </section>

    <section id="quotes" class="container quote-section">
        <h2>Daily Dose of Inspiration</h2>
        <p id="quote-display">Loading an inspiring quote...</p>
    </section>

    <footer>
        <p>&copy; 2025 Cancer Awareness Page</p>
    </footer>

    <script src="script.js"></script>
</body>
</html>
